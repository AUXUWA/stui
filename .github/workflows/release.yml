name: Release

# 打 v* 标签时构建各平台的二进制并挂到 GitHub Release 上。
# 推标签（git push origin v0.1.0）才会触发这套流程，普通推送不会。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          bin="target/${{ matrix.target }}/release/stui${{ matrix.ext }}"
          mkdir -p out pkg
          cp "$bin" pkg/stui${{ matrix.ext }}
          cp README.md LICENSE pkg/
          cd pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../out/stui-${version}-${{ matrix.name }}.zip" .
          else
            tar -czf "../out/stui-${version}-${{ matrix.name }}.tar.gz" .
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: stui-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 收集各平台的压缩包
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
